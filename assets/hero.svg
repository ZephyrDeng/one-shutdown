<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1017"/>
      <stop offset="1" stop-color="#1a1f2b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5f57"/>
      <stop offset="1" stop-color="#ff2d55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- BEFORE -->
  <text x="70" y="78" fill="#8b93a7" font-size="20" font-weight="600" letter-spacing="3">BEFORE</text>
  <text x="70" y="112" fill="#e6e9f0" font-size="28" font-weight="700">You click Shut Down and walk away…</text>

  <g filter="url(#shadow)" opacity="0.92">
    <g transform="translate(70 150) rotate(-3)">
      <rect width="500" height="112" rx="14" fill="#2a2e38" stroke="#3b404d"/>
      <rect x="20" y="22" width="40" height="40" rx="9" fill="#111"/>
      <text x="40" y="49" fill="#9aff9a" font-size="16" font-family="Menlo, monospace" text-anchor="middle">&gt;_</text>
      <text x="76" y="38" fill="#fff" font-size="17" font-weight="700">Terminate running processes?</text>
      <text x="76" y="62" fill="#a9b0c0" font-size="15">Closing this window will stop “npm run dev”.</text>
      <rect x="290" y="74" width="90" height="26" rx="6" fill="#3d424f"/>
      <text x="335" y="92" fill="#e6e9f0" font-size="14" text-anchor="middle">Cancel</text>
      <rect x="390" y="74" width="94" height="26" rx="6" fill="#0a84ff"/>
      <text x="437" y="92" fill="#fff" font-size="14" text-anchor="middle">Terminate</text>
    </g>
    <g transform="translate(100 285) rotate(2)">
      <rect width="500" height="112" rx="14" fill="#2a2e38" stroke="#3b404d"/>
      <rect x="20" y="22" width="40" height="40" rx="9" fill="#f5f5f7"/>
      <rect x="29" y="31" width="22" height="3" rx="1.5" fill="#999"/>
      <rect x="29" y="39" width="22" height="3" rx="1.5" fill="#999"/>
      <rect x="29" y="47" width="14" height="3" rx="1.5" fill="#999"/>
      <text x="76" y="38" fill="#fff" font-size="17" font-weight="700">Save changes to “Untitled”?</text>
      <text x="76" y="62" fill="#a9b0c0" font-size="15">Your changes will be lost if you don’t save them.</text>
      <rect x="290" y="74" width="90" height="26" rx="6" fill="#3d424f"/>
      <text x="335" y="92" fill="#e6e9f0" font-size="14" text-anchor="middle">Don’t Save</text>
      <rect x="390" y="74" width="94" height="26" rx="6" fill="#0a84ff"/>
      <text x="437" y="92" fill="#fff" font-size="14" text-anchor="middle">Save…</text>
    </g>
    <g transform="translate(60 420) rotate(-1.5)">
      <rect width="500" height="112" rx="14" fill="#2a2e38" stroke="#3b404d"/>
      <circle cx="40" cy="42" r="20" fill="#fbbc04"/>
      <path d="M40 42 L40 22 A20 20 0 0 1 57.3 52 Z" fill="#ea4335"/>
      <path d="M40 42 L57.3 52 A20 20 0 0 1 22.7 52 Z" fill="#34a853"/>
      <circle cx="40" cy="42" r="8" fill="#4285f4" stroke="#fff" stroke-width="3"/>
      <text x="76" y="38" fill="#fff" font-size="17" font-weight="700">Quit Google Chrome?</text>
      <text x="76" y="62" fill="#a9b0c0" font-size="15">You have 3 windows and 47 tabs open.</text>
      <rect x="290" y="74" width="90" height="26" rx="6" fill="#3d424f"/>
      <text x="335" y="92" fill="#e6e9f0" font-size="14" text-anchor="middle">Cancel</text>
      <rect x="390" y="74" width="94" height="26" rx="6" fill="#0a84ff"/>
      <text x="437" y="92" fill="#fff" font-size="14" text-anchor="middle">Quit</text>
    </g>
  </g>
  <text x="70" y="598" fill="#ff6b6b" font-size="22" font-weight="600">…and come back to a Mac that never turned off.</text>

  <!-- divider -->
  <line x1="660" y1="60" x2="660" y2="580" stroke="#2c3240" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- AFTER -->
  <text x="720" y="78" fill="#8b93a7" font-size="20" font-weight="600" letter-spacing="3">AFTER</text>

  <!-- menu bar mock -->
  <g filter="url(#shadow)">
    <rect x="720" y="100" width="500" height="34" rx="8" fill="#2a2e38"/>
    <text x="740" y="123" fill="#c8cdd8" font-size="15">  Finder   File   Edit   View</text>
    <rect x="1050" y="104" width="34" height="26" rx="6" fill="#0a84ff"/>
    <text x="1067" y="123" fill="#fff" font-size="17" text-anchor="middle">⏻</text>
    <text x="1100" y="123" fill="#c8cdd8" font-size="15">Fri 18:30</text>

    <rect x="1000" y="140" width="210" height="92" rx="10" fill="#2f3440" stroke="#454b5a"/>
    <rect x="1008" y="148" width="194" height="32" rx="6" fill="#0a84ff"/>
    <text x="1022" y="170" fill="#fff" font-size="16" font-weight="600">Shut Down Now</text>
    <line x1="1016" y1="190" x2="1194" y2="190" stroke="#454b5a"/>
    <text x="1022" y="217" fill="#c8cdd8" font-size="16">Quit</text>
    <text x="1192" y="217" fill="#8b93a7" font-size="15" text-anchor="end">⌘Q</text>
  </g>

  <!-- power glyph + title -->
  <g transform="translate(720 300)">
    <circle cx="44" cy="44" r="44" fill="url(#glow)"/>
    <path d="M44 22 V46" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <path d="M30 30 A22 22 0 1 0 58 30" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <text x="110" y="62" fill="#fff" font-size="60" font-weight="800" letter-spacing="-1">OneShutdown</text>
  </g>
  <text x="720" y="440" fill="#e6e9f0" font-size="27" font-weight="600">One click. No “Are you sure?”.</text>
  <text x="720" y="476" fill="#e6e9f0" font-size="27" font-weight="600">Every app force-quit. Mac off.</text>
  <text x="720" y="530" fill="#8b93a7" font-size="18">38 lines of Swift · no sudo · no Xcode · macOS 13+</text>
  <text x="720" y="598" fill="#34c759" font-size="22" font-weight="600">Pack up and leave in 2 seconds.</text>
</svg>
