<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a5f"/>
      <stop offset="1" stop-color="#e8264d"/>
    </linearGradient>
    <linearGradient id="hi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="gs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#8a0022" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS grid: 824px squircle centered on 1024 canvas -->
  <g filter="url(#s)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#g)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#hi)"/>
  <g filter="url(#gs)" fill="none" stroke="#fff" stroke-width="64" stroke-linecap="round">
    <path d="M512 290 V512"/>
    <path d="M376 362 A200 200 0 1 0 648 362"/>
  </g>
</svg>
